<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spectra</title>
<style>
  :root { --desk: #e4e0d8; --ink: #1d1b21; --quiet: #58524b; --sheet: #fbfaf7; --line: #d9d5cc; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) {
    :root { --desk: #0c0c0b; --ink: #eeebe7; --quiet: #b5afa8; --sheet: #1e1e24; --line: #1b1b1a; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--desk); color: var(--ink);
    font: 15px/1.5 "Segoe UI Variable Text", "Segoe UI", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    display: grid; place-items: center; padding: 16px;
    -webkit-user-select: none; user-select: none; cursor: default;
  }
  main { display: grid; justify-items: center; gap: 18px; max-width: 26rem; text-align: center; }
  img { width: 72px; height: 72px; animation: breathe 2.4s ease-in-out infinite; }
  [data-state="offline"] img { animation: none; opacity: .55; }
  h1 { font-size: 17px; font-weight: 600; margin: 0; }
  p { margin: 0; color: var(--quiet); }
  button {
    font: inherit; font-weight: 600; color: var(--ink); background: var(--sheet);
    border: 1px solid var(--line); border-radius: 10px; padding: 7px 16px; cursor: pointer;
  }
  button:focus-visible { outline: 2px solid #7c6cf0; outline-offset: 2px; }
  [hidden] { display: none !important; }
  @keyframes breathe { 50% { transform: scale(1.04); opacity: .85; } }
  @media (prefers-reduced-motion: reduce) { img { animation: none; } }
</style>
</head>
<body>
<main id="start" data-state="opening" aria-live="polite">
  <img src="prism.svg" alt="">
  <h1 id="title">Opening Spectra</h1>
  <p id="detail" hidden>Spectra can&rsquo;t reach the internet. Your folders keep syncing on this computer, and Spectra opens as soon as you&rsquo;re back online.</p>
  <button id="retry" type="button" hidden>Try again</button>
</main>
<script>
(function () {
  var desktop = window.spectraDesktop;
  var origin = desktop && desktop.origin ? desktop.origin.replace(/\/$/, "") : "https://spectra.ink";
  var start = document.getElementById("start");
  var title = document.getElementById("title");
  var detail = document.getElementById("detail");
  var retry = document.getElementById("retry");
  var timer = 0;
  var trying = false;

  function offline() {
    start.dataset.state = "offline";
    title.textContent = "You’re offline";
    detail.hidden = false;
    retry.hidden = false;
    clearTimeout(timer);
    timer = setTimeout(attempt, 10000);
  }

  function attempt() {
    if (trying) return;
    trying = true;
    clearTimeout(timer);
    var controller = new AbortController();
    var cut = setTimeout(function () { controller.abort(); }, 8000);
    // An opaque answer is enough: it proves Spectra is reachable.
    fetch(origin + "/favicon.ico?start=" + Date.now(), { mode: "no-cors", cache: "no-store", signal: controller.signal })
      // The workspace; someone signed out goes on to sign-in from there.
      .then(function () { location.replace(origin + "/workspace"); })
      .catch(function () { trying = false; offline(); })
      .finally(function () { clearTimeout(cut); });
  }

  retry.addEventListener("click", function () {
    start.dataset.state = "opening";
    title.textContent = "Opening Spectra";
    attempt();
  });
  window.addEventListener("online", attempt);
  attempt();
})();
</script>
</body>
</html>
