services:
  collaboration-gateway:
    build:
      context: ../..
      dockerfile: deploy/collaboration-gateway/Dockerfile
    restart: unless-stopped
    ports:
      - "1234:1234"
    environment:
      SPECTRA_COLLAB_PORT: "1234"
      SPECTRA_COLLAB_HOST: "0.0.0.0"
      CONVEX_URL: ${CONVEX_URL}
      NEXT_PUBLIC_CONVEX_URL: ${NEXT_PUBLIC_CONVEX_URL}
      SPECTRA_COLLAB_TOKEN_SECRET: ${SPECTRA_COLLAB_TOKEN_SECRET}
      SPECTRA_COLLAB_BRIDGE_KEY: ${SPECTRA_COLLAB_BRIDGE_KEY}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:1234/_spectra/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 3s
      retries: 3
    deploy:
      replicas: 1
