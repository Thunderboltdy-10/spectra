# Spectra collaboration gateway — Fly.io (P5.I2 default).
# Sticky single instance: rooms are in-memory; keep count at 1.
# Secrets: CONVEX_URL or NEXT_PUBLIC_CONVEX_URL, SPECTRA_COLLAB_TOKEN_SECRET,
# SPECTRA_COLLAB_BRIDGE_KEY.
#
# Deploy from the repository root (Docker context must include package.json):
#   fly deploy . -c deploy/collaboration-gateway/fly.toml --dockerfile deploy/collaboration-gateway/Dockerfile

app = "spectra-collaboration-gateway"
primary_region = "mad"

[build]
  dockerfile = "deploy/collaboration-gateway/Dockerfile"

[env]
  SPECTRA_COLLAB_PORT = "1234"
  SPECTRA_COLLAB_HOST = "0.0.0.0"

[http_service]
  internal_port = 1234
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 200
    soft_limit = 150

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    path = "/_spectra/health"
    timeout = "2s"

[vm]
  size = "shared-cpu-1x"
  memory = "512mb"
