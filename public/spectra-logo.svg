<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e8ee8" />
      <stop offset="100%" stop-color="#20b8b2" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#20b8b2" />
      <stop offset="100%" stop-color="#0fa57a" />
    </linearGradient>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0fa57a" />
      <stop offset="100%" stop-color="#ff8751" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-2" dy="4" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <g transform="translate(100, -5) scale(-1, 1)">
    <!-- Back folded part (Top left hook) -->
    <path d="M 40 35 L 20 35 L 25 15 L 45 15 Z" fill="url(#grad1)" opacity="0.6"/>
    
    <!-- Top Bar -->
    <path d="M 25 15 L 70 15 L 60 35 L 15 35 Z" fill="url(#grad1)" filter="url(#shadow)"/>
    
    <!-- Diagonal -->
    <path d="M 60 35 L 70 15 L 40 75 L 30 95 Z" fill="url(#grad2)" filter="url(#shadow)"/>
    
    <!-- Bottom Bar -->
    <path d="M 40 75 L 30 95 L 75 95 L 85 75 Z" fill="url(#grad3)" filter="url(#shadow)"/>

    <!-- Back folded part (Bottom right hook) -->
    <path d="M 75 95 L 95 95 L 90 75 L 70 75 Z" fill="url(#grad3)" opacity="0.6"/>
  </g>
</svg>