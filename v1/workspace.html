<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Spectra · V1 Frames</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@300;400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        bg: '#f5f3ef', bg2: '#ede9e3', bg3: '#e3ddd5',
        paper: '#fbfaf6',
        ink: { 100: '#1a1510', 200: '#3a322a', 300: '#6b5f52', 400: '#9e9082', 500: '#b8ab9d' },
        line: { DEFAULT: '#ddd8cf', strong: '#c9c2b6' },
        accent: '#0e8ee8',
        mint: '#20b8b2',
        coral: '#e05137',
        warn: '#b67616',
      },
      fontFamily: {
        display: ['Fraunces', 'serif'],
        sans: ['Manrope', 'system-ui', 'sans-serif'],
        mono: ['IBM Plex Mono', 'ui-monospace', 'monospace'],
      },
      boxShadow: {
        card: '0 10px 20px -14px rgba(7,20,35,0.1)',
        hover: '0 20px 40px -28px rgba(7,20,35,0.22)',
        soft: '0 18px 45px -28px rgba(8,22,40,0.14)',
      },
    }
  }
}
</script>
<style>
  html, body { background: #f5f3ef; color: #1a1510; font-family: 'Manrope', system-ui, sans-serif; letter-spacing: 0.005em; }
  body { margin: 0; overflow: hidden; }
  *::selection { background: rgba(14,142,232,0.25); }

  /* Canvas grid — very subtle paper dots */
  .paper-grid {
    background-image: radial-gradient(circle at 1px 1px, rgba(26,21,16,0.08) 1px, transparent 0);
    background-size: 28px 28px;
  }

  /* Field-style card — no box, just hover hints */
  .field {
    transition: transform 260ms cubic-bezier(0.22,1,0.36,1), box-shadow 260ms cubic-bezier(0.22,1,0.36,1), background 200ms;
  }
  .field:hover { background: rgba(251,250,246,0.7); box-shadow: 0 20px 40px -28px rgba(7,20,35,0.22); }
  .field.focused { background: #fbfaf6; box-shadow: 0 24px 48px -24px rgba(14,142,232,0.25), 0 2px 0 0 #0e8ee8 inset; }
  .field.bloomed { background: #fbfaf6; box-shadow: 0 40px 80px -30px rgba(7,20,35,0.28); z-index: 20; }

  /* Zoom-aware: the container itself doesn't scale font — we just show different layers */
  .layer { transition: opacity 240ms cubic-bezier(0.22,1,0.36,1); }

  /* Animated rule underline */
  .rule-grow { transform-origin: left; animation: rule-grow 500ms cubic-bezier(0.22,1,0.36,1) both; }
  @keyframes rule-grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }

  /* Bloom entrance */
  @keyframes bloom {
    0%   { transform: scale(0.985); opacity: 0.6; }
    100% { transform: scale(1);     opacity: 1; }
  }
  .bloom-in { animation: bloom 280ms cubic-bezier(0.22,1,0.36,1) both; }

  /* Staggered entrance */
  @keyframes drift-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .drift-in { animation: drift-in 420ms cubic-bezier(0.22,1,0.36,1) both; }

  /* Tray slide */
  @keyframes tray-in { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .tray-in { animation: tray-in 320ms cubic-bezier(0.22,1,0.36,1) both; }

  /* Minimap lens pulse */
  @keyframes lens-pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(14,142,232,0.0); } 50% { box-shadow: 0 0 0 4px rgba(14,142,232,0.12); } }
  .lens-pulse { animation: lens-pulse 2.6s ease-in-out infinite; }

  /* Subtle chat island glow */
  .chat-island { background: rgba(251,250,246,0.92); backdrop-filter: blur(14px) saturate(1.05); }
  .chat-island-border { border: 1px solid #ddd8cf; }
  .chat-island-active { border-color: rgba(14,142,232,0.55); box-shadow: 0 20px 44px -20px rgba(14,142,232,0.22), 0 0 0 3px rgba(14,142,232,0.08); }

  /* Tiny scrollbar in bloomed editor */
  .slim-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
  .slim-scroll::-webkit-scrollbar-thumb { background: #ddd8cf; border-radius: 4px; }

  /* Dotted connector between related items */
  .connector { stroke: #c9c2b6; stroke-dasharray: 2 4; fill: none; }

  /* Shrinking pulse on suggestion */
  @keyframes soft-breathe {
    0%,100% { opacity: 0.75; }
    50% { opacity: 1; }
  }
  .breathe { animation: soft-breathe 3.2s ease-in-out infinite; }

  /* Title font fine-tune */
  .font-display { font-family: 'Fraunces', serif; font-weight: 500; letter-spacing: -0.018em; }

  /* Ghost placeholder images */
  .placeholder-img {
    background:
      repeating-linear-gradient(135deg, rgba(26,21,16,0.04) 0 8px, transparent 8px 16px),
      #ede9e3;
  }

  /* Command results card */
  .result-island {
    animation: result-in 380ms cubic-bezier(0.22,1,0.36,1) both;
  }
  @keyframes result-in { from { opacity: 0; transform: translateY(8px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }

  /* Chip */
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
    color: #6b5f52;
    padding: 3px 8px;
    background: #fbfaf6;
    border: 1px solid #ddd8cf;
    border-radius: 999px;
  }

  /* Subtle drop shadow for top chrome */
  .chrome-shadow { box-shadow: 0 1px 0 rgba(221,216,207,0.7); }

  /* Selection rectangle */
  .lasso { border: 1px dashed rgba(14,142,232,0.55); background: rgba(14,142,232,0.05); border-radius: 4px; }

  /* Kbd */
  .kbd {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 18px; height: 18px;
    padding: 0 5px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: #6b5f52;
    border: 1px solid #ddd8cf;
    border-bottom-width: 2px;
    border-radius: 4px;
    background: #fbfaf6;
  }

  /* Bloom overlay — dims non-focused */
  .canvas-dim-layer {
    pointer-events: none;
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at var(--fx,50%) var(--fy,50%), transparent 0, transparent 22%, rgba(245,243,239,0.55) 60%);
    opacity: 0;
    transition: opacity 260ms ease;
  }
  .canvas-dim-layer.on { opacity: 1; }

  /* AI-touched glow: when AI modifies an item, it pulses cyan/mint briefly */
  @keyframes ai-glow {
    0%   { box-shadow: 0 0 0 0 rgba(14,142,232,0), 0 0 0 0 rgba(32,184,178,0); border-color: #ddd8cf; }
    15%  { box-shadow: 0 0 0 6px rgba(14,142,232,0.12), 0 20px 44px -14px rgba(14,142,232,0.35); border-color: rgba(14,142,232,0.7); }
    100% { box-shadow: 0 0 0 0 rgba(14,142,232,0); border-color: #ddd8cf; }
  }
  .ai-touched { animation: ai-glow 4.2s cubic-bezier(0.22,1,0.36,1) both; }
  .ai-touched::after {
    content: '✦ AI';
    position: absolute; top: 8px; right: 8px;
    font-family: 'IBM Plex Mono', monospace; font-size: 9px;
    letter-spacing: 0.14em;
    color: #fff; background: linear-gradient(135deg,#0e8ee8,#20b8b2);
    padding: 2px 6px; border-radius: 999px;
    animation: soft-breathe 2s ease-in-out infinite;
    pointer-events: none;
    z-index: 5;
  }

  /* Mini-preview for atlas */
  .atlas-tile {
    transition: transform 200ms ease, background 200ms ease, border-color 200ms ease;
  }
  .atlas-tile:hover { transform: translateY(-1px); background: #fbfaf6; }
  .atlas-tile.active { background: #fbfaf6; border-color: rgba(14,142,232,0.6); }
</style>
</head>
<body>
  <div id="root"></div>

  <template id="bundler-thumbnail">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">

      <circle cx="50" cy="50" r="4" fill="#0e8ee8"/>
      <path d="M 50 20 L 50 35" stroke="#6b5f52" stroke-width="1"/>
      <path d="M 50 65 L 50 80" stroke="#6b5f52" stroke-width="1"/>
      <path d="M 20 50 L 35 50" stroke="#6b5f52" stroke-width="1"/>
      <path d="M 65 50 L 80 50" stroke="#6b5f52" stroke-width="1"/>
    </svg>
  </template>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="./data.jsx"></script>
  <script type="text/babel" src="./icons.jsx"></script>
  <script type="text/babel" src="./items.jsx"></script>
  <script type="text/babel" src="./chrome.jsx"></script>
  <script type="text/babel" src="./app.jsx"></script>
</body>
</html>
